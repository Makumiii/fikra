name: Bug report
description: Report a reproducible Fikra problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fikra commit, browser, Node version, and local or Cloudflare runtime. Never include secrets.
